<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Processing WebSocket Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 20px;
        }
        .left-panel, .right-panel {
            flex: 1;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #logs {
            border: 1px solid #ddd;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
            background-color: #f8f9fa;
            font-family: monospace;
            white-space: pre-wrap;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 0;
        }
        .log-status {
            color: #007bff;
            font-weight: bold;
        }
        .log-error {
            color: #dc3545;
            font-weight: bold;
        }
        .log-info {
            color: #28a745;
        }
        .status-info {
            padding: 10px;
            background-color: #e9ecef;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Document Processing WebSocket Test</h1>
    <p><em>Files are uploaded to CargaConocimiento_iA/company_files/files/ and processed independently</em></p>
    
    <div class="container">
        <div class="left-panel">
            <h3>File Upload & Processing</h3>
            
            
            <div class="form-group">
                <label for="files">Select PDF Files:</label>
                <input type="file" id="files" multiple accept=".pdf">
            </div>
            
            <div class="form-group">
                <label for="company">Company Name:</label>
                <input type="text" id="company" placeholder="e.g., Acme" required>
            </div>
            
            <div class="form-group">
                <label for="area">Area Name:</label>
                <input type="text" id="area" placeholder="e.g., Marketing" required>
            </div>
            
            <button onclick="uploadFiles()">Upload Files</button>
            <button id="startBtn" onclick="startProcessing()" disabled>Start Processing</button>
            <button onclick="connectWebSocket()" id="connectBtn">Connect WebSocket</button>
            <button onclick="disconnectWebSocket()" id="disconnectBtn" disabled>Disconnect</button>
            
            <div class="status-info">
                <strong>Status:</strong> <span id="status">Ready</span><br>
                <strong>Task ID:</strong> <span id="taskId">None</span><br>
                <strong>WebSocket:</strong> <span id="wsStatus">Disconnected</span>
            </div>
        </div>
        
        <div class="right-panel">
            <h3>Processing Logs</h3>
            <div id="logs"></div>
            <button onclick="clearLogs()">Clear Logs</button>
        </div>
    </div>

    <script>
        let websocket = null;
        let currentTaskId = null;
        
        function log(message, type = 'info') {
            const logs = document.getElementById('logs');
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logs.appendChild(entry);
            logs.scrollTop = logs.scrollHeight;
        }
        
        function updateStatus(status) {
            document.getElementById('status').textContent = status;
        }
        
        function updateTaskId(taskId) {
            document.getElementById('taskId').textContent = taskId;
            currentTaskId = taskId;
        }
        
        function updateWSStatus(status) {
            document.getElementById('wsStatus').textContent = status;
        }
        
        async function uploadFiles() {
            const files = document.getElementById('files').files;
            const company = document.getElementById('company').value;
            const area = document.getElementById('area').value;
            
            if (!files.length) {
                alert('Please select files');
                return;
            }
            
            if (!company || !area) {
                alert('Please fill in company and area names');
                return;
            }
            
            const formData = new FormData();
            for (let file of files) {
                formData.append('files', file);
            }
            formData.append('company_name', company);
            formData.append('area_name', area);
            
            try {
                updateStatus('Uploading...');
                log('Starting file upload...');
                
                const response = await fetch('/api/v1/processing/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    updateStatus('Files uploaded');
                    updateTaskId(result.task_id);
                    document.getElementById('startBtn').disabled = false;
                    log(`Files uploaded successfully. Task ID: ${result.task_id}`, 'status');
                    log(`Files uploaded: ${result.files_uploaded}`, 'info');
                } else {
                    updateStatus('Upload failed');
                    log(`Upload failed: ${JSON.stringify(result)}`, 'error');
                }
            } catch (error) {
                updateStatus('Upload error');
                log(`Upload error: ${error.message}`, 'error');
            }
        }
        
        async function startProcessing() {
            if (!currentTaskId) {
                alert('No task ID available');
                return;
            }
            
            
            try {
                updateStatus('Starting processing...');
                log('Starting document processing...');
                
                const response = await fetch(`/api/v1/processing/start/${currentTaskId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    updateStatus('Processing started');
                    document.getElementById('startBtn').disabled = true;
                    log('Processing started successfully', 'status');
                } else {
                    updateStatus('Start failed');
                    log(`Start processing failed: ${JSON.stringify(result)}`, 'error');
                }
            } catch (error) {
                updateStatus('Start error');
                log(`Start processing error: ${error.message}`, 'error');
            }
        }
        
        function connectWebSocket() {
            if (!currentTaskId) {
                alert('No task ID available');
                return;
            }
            
            if (websocket) {
                log('WebSocket already connected', 'info');
                return;
            }
            
            const wsUrl = `ws://localhost:8000/api/v1/processing/ws/logs?task_id=${currentTaskId}`;
            log(`Connecting to WebSocket: ${wsUrl}`);
            
            websocket = new WebSocket(wsUrl);
            
            websocket.onopen = function(event) {
                updateWSStatus('Connected');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                log('WebSocket connected', 'status');
            };
            
            websocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'log') {
                        log(`${data.message}`, 'info');
                    } else if (data.type === 'status') {
                        log(`STATUS: ${data.message}`, 'status');
                        updateStatus(data.status);
                    } else if (data.type === 'error') {
                        log(`ERROR: ${data.message}`, 'error');
                        updateStatus(data.status);
                    } else {
                        log(`Unknown message type: ${JSON.stringify(data)}`, 'info');
                    }
                } catch (error) {
                    log(`Raw message: ${event.data}`, 'info');
                }
            };
            
            websocket.onclose = function(event) {
                updateWSStatus('Disconnected');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                log('WebSocket disconnected', 'info');
                websocket = null;
            };
            
            websocket.onerror = function(error) {
                log(`WebSocket error: ${error}`, 'error');
            };
        }
        
        function disconnectWebSocket() {
            if (websocket) {
                websocket.close();
                websocket = null;
                updateWSStatus('Disconnected');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                log('WebSocket disconnected manually', 'info');
            }
        }
        
        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }
        
        // Auto-connect WebSocket when task ID is available
        setInterval(() => {
            if (currentTaskId && !websocket) {
                const connectBtn = document.getElementById('connectBtn');
                if (!connectBtn.disabled) {
                    // Auto-connect suggestion
                    log('Tip: Connect WebSocket to see real-time logs', 'info');
                }
            }
        }, 5000);
    </script>
</body>
</html>
